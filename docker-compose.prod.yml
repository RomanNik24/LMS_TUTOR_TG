version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    image: ${REGISTRY}/lms-app:${TAG}
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/lms
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_MODE=webhook
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - WEBHOOK_PATH_SECRET=${WEBHOOK_PATH_SECRET}
      - OWNER_TELEGRAM_ID=${OWNER_TELEGRAM_ID}
      - TEACHER_CONTACT_URL=${TEACHER_CONTACT_URL}
      - PUBLIC_BASE_URL=https://${DOMAIN}
      - SESSION_SECRET=${SESSION_SECRET}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - SCHEDULE_HORIZON_WEEKS=4
      - DEFAULT_TIMEZONE=Europe/Moscow
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  worker:
    image: ${REGISTRY}/lms-app:${TAG}
    command: taskiq worker src.worker.broker:broker
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/lms
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  scheduler:
    image: ${REGISTRY}/lms-app:${TAG}
    command: taskiq scheduler src.worker.broker:scheduler
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/lms
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  nginx:
    image: ${REGISTRY}/lms-frontend:${TAG}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data: