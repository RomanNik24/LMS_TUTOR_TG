[project]
name = "lms-tutor-tg"
version = "0.1.0"
description = "MY_LMS - Telegram bot and Mini App for private tutors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Telegram Bot
    "aiogram>=3.7",

    # Background tasks
    "taskiq>=0.5",
    "taskiq-redis>=0.2",
    "redis>=5.0",

    # S3 Storage
    "aioboto3>=12.3",
    "pillow>=10.0",
    "pillow-heif>=0.5",

    # Security
    "cryptography>=42.0",
    "python-multipart>=0.0.6",

    # Monitoring
    "sentry-sdk[fastapi]>=1.39",

    # Utilities
    "httpx>=0.26",
    "python-json-logger>=2.0",
    "python-dateutil>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "testcontainers>=4.7",
    "time-machine>=2.14",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[tool.uv]
# Приложение, а не библиотека: собирать wheel не требуется,
# поэтому uv не пытается ставить проект в editable-режиме.
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "TCH", "PTH",
    "ERA", "PD", "PIE", "PT", "Q", "RET", "RSE", "SLF", "TRY", "NPY",
]
ignore = ["E501", "D100", "D101", "D102", "D103", "D104", "D107"]
fixable = ["I", "UP", "PTH", "ERA", "PD", "PIE", "PT", "Q", "RET", "RSE", "SLF", "TRY"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py", "src/**/migrations/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"