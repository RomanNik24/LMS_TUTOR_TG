version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lms_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-my_lms}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-my_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Разовый контейнер: применяет миграции Alembic перед стартом сервисов
  migrate:
    build: .
    container_name: lms_migrate
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: lms_api
    restart: always
    command: ["python", "-m", "src.server"]
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      WEBAPP_UPSTREAM_URL: http://webapp:8550
      # Проброс флага окружения из хоста (по умолчанию development).
      # В production задайте ENVIRONMENT=production в .env — тогда сервисы
      # не стартуют с дефолтными секретами (см. src/core/config.py).
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    container_name: lms_bot
    restart: always
    command: ["python", "-m", "src.bot.main"]
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  webapp:
    build: .
    container_name: lms_webapp
    restart: always
    command: ["python", "-m", "src.webapp.main"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - api

  # Фоновые задачи: напоминания об уроках/ДЗ, автозакрытие (docs/01 п.5)
  worker:
    build: .
    container_name: lms_worker
    restart: always
    command: ["python", "-m", "src.worker"]
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
