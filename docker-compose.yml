services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Локальное S3-совместимое хранилище.
  # Заменяет MinIO: образы minio/minio и minio/mc удалены из Docker Hub
  # в сентябре 2026, а анонимный pull с quay.io/minio больше не работает.
  # В проде по ТЗ используется реальный S3 (Timeweb/Selectel).
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -s3 -dir=/data -ip=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - s3_data:/data
    ports:
      - "8333:8333"
      - "8888:8888"
    healthcheck:
      test: ["CMD", "/usr/bin/weed", "version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Одноразовая миграция БД (alembic). Появится после этапа S1.02.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - .env.local
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lms
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lms
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://s3:8333
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=lms-files
      - S3_REGION=us-east-1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: taskiq worker src.worker.broker:broker
    env_file:
      - .env.local
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lms
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: taskiq scheduler src.worker.broker:scheduler
    env_file:
      - .env.local
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lms
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  s3_data: